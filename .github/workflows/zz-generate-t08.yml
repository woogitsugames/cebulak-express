name: T08 - temporary asset generation

on:
  push:
    branches: [zlecenie/08-tla-uk-fr]
    paths:
      - .github/workflows/zz-generate-t08.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T08
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - name: Render original SVG-derived PNG assets and inspect seams
        run: python public/assets/landmarks/generate-uk-fr-assets.py public/assets
      - name: Commit assets to T08 branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/countries/uk public/assets/countries/fr public/assets/landmarks
          git diff --cached --quiet || git commit -m 'Dodaj grafiki tla UK/FR, przepraw i arkusze podgladu'
          git push origin HEAD:zlecenie/08-tla-uk-fr
