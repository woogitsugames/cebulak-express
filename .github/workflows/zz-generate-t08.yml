name: T08 - regenerate explicit sRGB PNGs
on:
  push:
    branches: [zlecenie/08-tla-uk-fr]
    paths: [.github/workflows/zz-generate-t08.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - run: python public/assets/landmarks/generate-uk-fr-assets.py public/assets
      - name: Check RGB space
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('public/assets').rglob('*.png'):
              if '/uk/' not in str(p) and '/fr/' not in str(p) and '/landmarks/' not in str(p):
                  continue
              assert b'sRGB' in p.read_bytes(),str(p)
          print('Explicit sRGB in all T08 PNGs')
          PY
      - name: Commit regenerated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/countries/uk public/assets/countries/fr public/assets/landmarks
          git diff --cached --quiet || git commit -m 'Zapisz metadane sRGB dla wszystkich grafik T08'
          git push origin HEAD:zlecenie/08-tla-uk-fr
