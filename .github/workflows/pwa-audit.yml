name: PWA / Lighthouse

on:
  pull_request:
    paths:
      - 'src/pwa/**'
      - 'scripts/pwa-*'
      - 'public/manifest.webmanifest'
      - 'public/assets/brand/**'
      - 'vite.config.ts'
      - '.github/workflows/pwa-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Chromium offline i Lighthouse Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Offline PWA i Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/ce-pwa-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          node scripts/pwa-smoke.mjs http://127.0.0.1:4173/
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse http://127.0.0.1:4173/ \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=performance --output=json --output-path="$RUNNER_TEMP/lighthouse-pwa.json" --quiet
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/lighthouse-pwa.json", "utf8"));
            console.log(`Lighthouse Performance: ${Math.round(r.categories.performance.score * 100)}/100`);
            console.log(`LCP: ${r.audits["largest-contentful-paint"]?.displayValue ?? "brak danych"}`);
            console.log(`FCP: ${r.audits["first-contentful-paint"]?.displayValue ?? "brak danych"}`);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-pwa-json
          path: ${{ runner.temp }}/lighthouse-pwa.json
          if-no-files-found: ignore
          retention-days: 14
