name: [35] Tymczasowa regeneracja npm lockfile

on:
  push:
    branches: [zlecenie/35-firebase-produkcja]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zlecenie/35-firebase-produkcja
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wygeneruj prawidłowy package-lock dla Firebase 11.10.0
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Zapisz zmiany lockfile na gałęzi zlecenia
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[35] Zaktualizuj package-lock dla Firebase SDK"
          git push origin HEAD:refs/heads/zlecenie/35-firebase-produkcja
