name: "[35] Weryfikacja po integracji Firebase"

on:
  push:
    branches: [zlecenie/35-firebase-produkcja]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rozmiar gzip chunków Firebase (szczegóły w logach)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import path from 'node:path';
          const assets = 'dist/assets';
          const files = fs.readdirSync(assets).filter(f => f.endsWith('.js'));
          for (const f of files) {
            const raw = fs.readFileSync(path.join(assets, f));
            console.log('JS_BUNDLE_SIZE', f, 'raw', raw.length, 'gzip', zlib.gzipSync(raw).length);
          }
          NODE
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-14.12.0
      - run: npm ci
      - run: npm install --prefix firebase --package-lock=false --no-audit --no-fund
      - run: npm --prefix firebase run build
      - run: npm --prefix firebase run test:unit
      - run: npm run test:firebase
