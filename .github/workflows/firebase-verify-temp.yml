name: "[35] Testy weryfikacyjne Firebase (tymczasowo)"

on:
  push:
    branches: [zlecenie/35-firebase-produkcja]

permissions:
  contents: read

jobs:
  web:
    name: Web - npm ci, typy, testy i build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rozmiar JS gzip
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import path from 'node:path';
          for (const file of fs.readdirSync('dist/assets').filter(f => f.endsWith('.js'))) {
            const data = fs.readFileSync(path.join('dist/assets', file));
            console.log('JS_BUNDLE_SIZE', file, 'raw', data.length, 'gzip', zlib.gzipSync(data).length);
          }
          NODE
  backend:
    name: Functions - build i emulatory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-14.12.0
      - run: npm ci
      - run: npm install --prefix functions --package-lock=false --no-audit --no-fund
      - run: npm --prefix functions run build
      - run: npm --prefix functions run test:unit
      - run: npm run test:firebase
