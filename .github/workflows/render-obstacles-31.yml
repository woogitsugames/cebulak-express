name: Jednorazowe wygenerowanie przeszkod 31
on:
  push:
    branches:
      - zlecenie/31-przeszkody-wektor
    paths:
      - public/assets/obstacles/source-package.b64
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/zlecenie/31-przeszkody-wektor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Odtworz autorskie assety i usun pliki tymczasowe
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/obstacles/source-package.part*.txt | base64 --decode > /tmp/source-31.tar.gz
          echo 'ff36e476994fac82e6ee470a7f884e9429af6381c888bfb22949154626e7c8ad  /tmp/source-31.tar.gz' | sha256sum -c
          tar -xzf /tmp/source-31.tar.gz
          python -m pip install --disable-pip-version-check 'cairosvg>=2.7,<3' 'pillow>=10,<13'
          python public/assets/obstacles/generate-assets.py
          rm public/assets/obstacles/source-package.b64 public/assets/obstacles/source-package.part*.txt
          rm .github/workflows/render-obstacles-31.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets/obstacles docs/art/podglady/obstacles-preview.png .github/workflows/render-obstacles-31.yml
          git commit -m 'Wygeneruj przeszkody wektorowe i podglad (31)'
          git push origin HEAD:zlecenie/31-przeszkody-wektor
