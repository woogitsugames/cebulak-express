<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b2733" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="assets/brand/icon-1024.png" />
    <meta name="description" content="Polonijna gra na jeden palec: przeładowane kombi leci z Twojego kraju do domu w Polsce." />
    <title>Cebulak Express</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="Gra Cebulak Express"></canvas>

      <div id="hud" hidden>
        <div class="hud-row">
          <div class="pill"><span id="hud-km">0 km</span></div>
          <div class="pill" id="hud-lives" hidden></div>
        </div>
        <div class="hud-remaining" id="hud-remaining"></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        <div class="hint" id="hint" role="status">Dotknij, aby wystartować</div>
      </div>

      <section id="menu" class="panel panel--menu" aria-label="Menu główne">
        <h1 class="menu-logo">
          <img src="assets/brand/logo.png" alt="Cebulak Express — Kierunek Polska" />
        </h1>
        <p class="menu-subtitle">Przygoda na jeden palec</p>
        <div class="menu-car-scene" aria-hidden="true">
          <img class="menu-car-scene__wheel menu-car-scene__wheel--rear" src="assets/hero/kombi-wheel.png" alt="" />
          <img class="menu-car-scene__wheel menu-car-scene__wheel--front" src="assets/hero/kombi-wheel.png" alt="" />
          <img class="menu-car-scene__layer menu-car-scene__body" src="assets/hero/kombi-body.png" alt="" />
          <img class="menu-car-scene__layer menu-car-scene__luggage" src="assets/hero/luggage-2.png" alt="" />
        </div>

        <div class="modes" role="radiogroup" aria-label="Tryb gry">
          <button type="button" class="mode" data-mode="ranked" role="radio">Rankingowy</button>
          <button type="button" class="mode" data-mode="cozy" role="radio">Łagodny</button>
        </div>
        <button type="button" class="btn btn--green btn--play" id="btn-start">Lecimy!</button>
        <div class="menu-action-grid">
          <button type="button" class="btn btn--blue" id="btn-daily">Wyzwanie dnia</button>
          <button type="button" class="btn btn--blue" id="btn-league">Liga Polonii</button>
          <button type="button" class="btn btn--wood" id="btn-garage">Garaż</button>
          <button type="button" class="btn btn--wood" id="btn-album">Album</button>
        </div>
        <p class="daily-info" id="daily-info"></p>

        <details class="route-picker" id="route-picker">
          <summary id="route-toggle">
            <img id="route-flag" src="assets/ui/flag-be.png" alt="" />
            <span class="route-picker__text">
              <strong>Zmień trasę</strong>
              <small id="route-summary"></small>
            </span>
            <span class="route-picker__chevron" aria-hidden="true"></span>
          </summary>
          <div class="route-picker__content">
            <label class="field">Mieszkam w
              <select id="sel-home"></select>
            </label>
            <label class="field">Startuję z
              <select id="sel-from"></select>
            </label>
            <label class="field">Lecę do
              <select id="sel-to"></select>
            </label>
            <p class="route" id="route-info"></p>
          </div>
        </details>
      </section>

      <section id="league" class="panel panel--sub" aria-label="Liga Polonii" hidden>
        <div id="league-body"></div>
        <button type="button" class="btn btn--wood btn--sub-close" id="btn-league-close">Powrót do menu</button>
      </section>

      <section id="garage" class="panel panel--sub panel--garage" aria-label="Garaż" hidden></section>
      <section id="album" class="panel panel--sub panel--album" aria-label="Album" hidden></section>

      <section id="over" class="panel panel--over" aria-labelledby="over-title" hidden>
        <h2 class="over-ribbon" id="over-title">Koniec trasy!</h2>
        <div class="over-distance">
          <img src="assets/ui/icon-km.png" alt="" class="over-icon" />
          <div>
            <span class="over-eyebrow">Przejechany dystans</span>
            <p class="big" id="over-km">0 km</p>
          </div>
        </div>
        <p class="sub" id="over-route"></p>
        <div class="over-cause-box">
          <img src="assets/obstacles/roadworks-end.png" alt="" id="over-cause-icon" />
          <p class="cause" id="over-cause"></p>
        </div>
        <p class="joke" id="over-joke"></p>
        <p class="best" id="over-best"></p>

        <section id="over-mini-league" class="mini-league" aria-label="Pierwsza trójka Ligi Polonii" hidden>
          <h3><img src="assets/ui/icon-trophy.png" alt="" /> Liga Polonii <span>TOP 3</span></h3>
          <ol id="over-league-list"></ol>
        </section>

        <div class="over-actions">
          <button type="button" class="btn btn--green" id="btn-again">Zagraj ponownie</button>
          <button type="button" class="btn btn--blue" id="btn-share">Udostępnij</button>
          <button type="button" class="btn btn--wood" id="btn-return-flight" hidden>Lot powrotny</button>
        </div>
        <a class="portal" id="over-portal" target="_blank" rel="noopener noreferrer" hidden></a>
        <button type="button" class="btn btn--wood btn--return" id="btn-menu">Zmień trasę</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
